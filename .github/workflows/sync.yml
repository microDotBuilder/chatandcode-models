name: Sync model manifest

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [overrides.json, sync.mjs]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node sync.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- model-manifest.json && git ls-files --error-unmatch model-manifest.json >/dev/null 2>&1; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-manifest.json
          git commit -m "chore: sync model manifest from upstream"
          git push
